<script type="text/html" data-template-name="alephscript-config">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-config-input-name" placeholder="AlephScript Server">
    </div>
    <div class="form-row">
        <label for="node-config-input-serverUrl"><i class="fa fa-server"></i> Server URL</label>
        <input type="text" id="node-config-input-serverUrl" placeholder="http://localhost:3001" style="width: 60%;">
    </div>
    <div class="form-row">
        <label for="node-config-input-namespace"><i class="fa fa-folder"></i> Namespace</label>
        <input type="text" id="node-config-input-namespace" placeholder="/" style="width: 30%;">
    </div>
    <div class="form-row">
        <label>&nbsp;</label>
        <input type="checkbox" id="node-config-input-reconnection" style="display: inline-block; width: auto; vertical-align: top;">
        <label for="node-config-input-reconnection" style="width: 70%;">Auto-reconnect</label>
    </div>
    <div class="form-row" id="reconnection-options">
        <label for="node-config-input-reconnectionAttempts"><i class="fa fa-refresh"></i> Attempts</label>
        <input type="number" id="node-config-input-reconnectionAttempts" placeholder="5" style="width: 60px;">
        <label for="node-config-input-reconnectionDelay" style="margin-left: 20px;"><i class="fa fa-clock-o"></i> Delay (ms)</label>
        <input type="number" id="node-config-input-reconnectionDelay" placeholder="1000" style="width: 80px;">
    </div>
    <div class="form-row">
        <label for="node-config-input-timeout"><i class="fa fa-hourglass"></i> Timeout (ms)</label>
        <input type="number" id="node-config-input-timeout" placeholder="5000" style="width: 80px;">
    </div>
</script>

<script type="text/html" data-help-name="alephscript-config">
    <p><strong>AlephScript Server Configuration</strong></p>
    <p>Shared configuration node for AlephScript Dashboard 2.0 widgets.</p>
    
    <h3>Properties</h3>
    <dl class="message-properties">
        <dt>Name <span class="property-type">string</span></dt>
        <dd>Display name for this configuration</dd>
        
        <dt>Server URL <span class="property-type">string</span></dt>
        <dd>AlephScript server URL (default: http://localhost:3001)</dd>
        
        <dt>Namespace <span class="property-type">string</span></dt>
        <dd>Socket.IO namespace (default: /)</dd>
        
        <dt>Auto-reconnect <span class="property-type">boolean</span></dt>
        <dd>Enable automatic reconnection on disconnect</dd>
        
        <dt>Attempts <span class="property-type">number</span></dt>
        <dd>Maximum reconnection attempts (default: 5)</dd>
        
        <dt>Delay <span class="property-type">number</span></dt>
        <dd>Delay between reconnection attempts in ms (default: 1000)</dd>
        
        <dt>Timeout <span class="property-type">number</span></dt>
        <dd>Connection timeout in ms (default: 5000)</dd>
    </dl>
    
    <h3>Details</h3>
    <p>This configuration node manages the Socket.IO connection to the AlephScript server. 
    It's shared between all AlephScript Dashboard 2.0 widgets:</p>
    <ul>
        <li><strong>Bot Registry</strong> - Register and manage up to 2 bots</li>
        <li><strong>Room Tester</strong> - Test cross-room communication</li>
        <li><strong>Stream Monitor</strong> - Monitor real-time message streams</li>
        <li><strong>Channel Monitor</strong> - Monitor App/Sys/UI channel status</li>
    </ul>
    
    <h3>AlephScript Protocol</h3>
    <p>Implements the full AlephScript protocol flow:</p>
    <ol>
        <li><code>CLIENT_REGISTER</code> - Initial client registration</li>
        <li><code>CLIENT_SUSCRIBE</code> - Subscribe to channels</li>
        <li><code>MAKE_MASTER</code> - Establish master status</li>
    </ol>
</script>

<script type="text/javascript">
    RED.nodes.registerType('alephscript-config', {
        category: 'config',
        defaults: {
            name: { value: "AlephScript Server" },
            serverUrl: { value: "http://localhost:3001", required: true },
            namespace: { value: "/" },
            reconnection: { value: true },
            reconnectionAttempts: { value: 5, validate: RED.validators.number() },
            reconnectionDelay: { value: 1000, validate: RED.validators.number() },
            timeout: { value: 5000, validate: RED.validators.number() }
        },
        label: function() {
            return this.name || "AlephScript Server";
        },
        oneditprepare: function() {
            // Show/hide reconnection options based on checkbox
            function toggleReconnectionOptions() {
                if ($("#node-config-input-reconnection").is(':checked')) {
                    $("#reconnection-options").show();
                } else {
                    $("#reconnection-options").hide();
                }
            }
            
            $("#node-config-input-reconnection").change(toggleReconnectionOptions);
            toggleReconnectionOptions();
        }
    });
</script>
